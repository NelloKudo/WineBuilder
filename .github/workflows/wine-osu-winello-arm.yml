name: wine-osu-winello-arm
on:
  workflow_dispatch:
  push:
    branches:
      - 'arm64'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    name: Build Wine (ARM64)
    steps:
      - name: Debloat GitHub CI
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true

      - uses: actions/checkout@v7

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ./ccache
          key: ccache-arm64-${{ github.run_id }}
          restore-keys: |
            ccache-arm64-

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Run build.sh
        env:
          BUILD_ARCH: aarch64
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ./ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wine-osu-arm64
          path: ./*.tar.xz
