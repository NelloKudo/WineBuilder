name: wine-osu-winello-arm
on:
  workflow_dispatch:
  push:
    branches:
      - 'arm64'
    tags:
      - 'wine-osu*'
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - build_type: "release"
            debug: "false"
          - build_type: "debug"
            debug: "true"
    name: Build Wine (${{ matrix.build_type }})
    steps:
      - name: Debloat GitHub CI
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - uses: actions/checkout@v4
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./ccache
          key: ccache-arm64-${{ matrix.build_type }}-${{ github.run_id }}
          restore-keys: |
            ccache-arm64-${{ matrix.build_type }}-
      - uses: docker/setup-buildx-action@v3.10.0
        with:
          driver: docker
      - name: Run build.sh
        run: |
          chmod +x build.sh
          ./build.sh "true" "true" "${{ matrix.debug }}" "true" "false"
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-osu-arm64-${{ matrix.build_type }}
          path: ./*.tar.xz
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    steps:
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: wine-osu-arm64-debug
          path: ./artifacts/
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: wine-osu-arm64-release
          path: ./artifacts/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ./artifacts/*.tar.xz
          release_name: "${{ github.ref_name }}"