name: spritz-wine-tkg + ntsync

on:
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:
  push:
    tags:
      - 'spritz*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - name: main
            branch: master
            artifact: spritz-wine-tkg
          - name: ntsync
            branch: ntsync
            artifact: spritz-wine-tkg-ntsync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./ccache
          key: ccache-${{ matrix.config.name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.config.name }}-

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.10.0
        with:
          driver: docker

      - name: Run build.sh for ${{ matrix.config.name }}
        run: |
          chmod +x build.sh
          export CC="ccache gcc"
          export CXX="ccache g++"
          WINE_OSU="false" \
          BUILD_NAME="spritz-wine" \
          USE_TKG="true" \
          PATCHSET="remote:latest" \
          PATCHSET_REPO="https://github.com/NelloKudo/WineSpritz.git" \
          WINE_BRANCH="${{ matrix.config.branch }}" \
          TAG_FILTER="spritz*" \
          ./build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact }}
          path: ./*.tar.xz