name: spritz-wine-tkg + ntsync

on:
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:
  push:
    tags:
      - 'spritz*'

jobs:
  build-main:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.set-output.outputs.artifact }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
        key: spritz-main-${{ runner.os }}-${{ hashFiles('**/build.sh') }}
        restore-keys: |
          spritz-main-${{ runner.os }}-

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3.10.0
      with:
        driver: docker

    - name: Run build.sh for main
      run: |
        chmod +x build.sh
        WINE_OSU="false" BUILD_NAME="spritz-wine" \
        USE_TKG="true" PATCHSET="remote:latest" \
        PATCHSET_REPO="https://github.com/NelloKudo/WineSpritz.git" \
        TAG_FILTER="spritz*" ./build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spritz-wine-tkg
        path: ./*.tar.xz

  build-ntsync:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.set-output.outputs.artifact }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
        key: spritz-ntsync-${{ runner.os }}-${{ hashFiles('**/build.sh') }}
        restore-keys: |
          spritz-ntsync-${{ runner.os }}-

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3.10.0
      with:
        driver: docker

    - name: Run build.sh for ntsync
      run: |
        chmod +x build.sh
        WINE_OSU="false" BUILD_NAME="spritz-wine" \
        USE_TKG="true" PATCHSET="remote:latest" \
        PATCHSET_REPO="https://github.com/NelloKudo/WineSpritz.git" \
        WINE_BRANCH="ntsync" TAG_FILTER="spritz*" ./build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spritz-wine-tkg-ntsync
        path: ./*.tar.xz

  release:
    runs-on: ubuntu-latest
    needs: [build-main, build-ntsync]
    if: github.ref_type == 'tag'
    steps:
    - name: Download main artifact
      uses: actions/download-artifact@v4
      with:
        name: spritz-wine-tkg
        path: ./release-artifacts/

    - name: Download ntsync artifact
      uses: actions/download-artifact@v4
      with:
        name: spritz-wine-tkg-ntsync
        path: ./release-artifacts/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2.2.1
      if: always()
      with:
        files: ./release-artifacts/*.tar.xz
        release_name: "spritz-wine-tkg-${{ github.ref_name }}"
        make_latest: false
