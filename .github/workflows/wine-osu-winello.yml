name: wine-osu-winello

on:
  workflow_dispatch:
  push:
    tags:
      - 'wine-osu*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debug: [false, true]

    name: Build Wine (debug=${{ matrix.debug }})

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ./ccache
          key: ccache-${{ matrix.debug }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.debug }}-

      - uses: docker/setup-buildx-action@v3.10.0
        with:
          driver: docker

      - name: Run build.sh
        run: |
          chmod +x build.sh
          ./build.sh "true" "true" "${{ matrix.debug }}" "false" "false"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-osu-${{ matrix.debug && 'debug' || 'release' }}
          path: ./*.tar.xz

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'

    steps:
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: wine-osu-debug
          path: ./artifacts/

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: wine-osu-release
          path: ./artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: ./artifacts/*.tar.xz
          release_name: "${{ github.ref_name }}"